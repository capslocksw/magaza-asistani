[project]
name = "magaza-agent-api"
version = "0.1.0"
description = "ADK-based shopping assistant agent served over SSE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "magaza-core",
  "google-adk>=1.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_api"

[tool.uv.sources]
magaza-core = { workspace = true }
