[project]
name = "magaza-admin-api"
version = "0.1.0"
description = "Tenant management, dashboards and exports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "magaza-core[pdf]",
  "magaza-jobs",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "firebase-admin>=6.8",
  "duckdb>=1.3",
  "google-cloud-bigquery>=3.30",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "admin_api"

[tool.uv.sources]
magaza-core = { workspace = true }
magaza-jobs = { workspace = true }
