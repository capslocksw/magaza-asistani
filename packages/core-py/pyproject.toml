[project]
name = "magaza-core"
version = "0.1.0"
description = "Shared models, tenant context, repository layer and event schema"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11",
  "google-cloud-firestore>=2.21",
  "google-genai>=1.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=65", "playwright>=1.52", "jinja2>=3.1", "markdown>=3.8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "magaza_core"
